{% extends "crm/base.html" %}

{% block crm_content %}
<!-- Back Button -->
<div style="margin-bottom: 24px;">
  <a href="{% url 'crm:company_list' %}" style="font: 600 14px var(--t); color: var(--core); display: inline-flex; align-items: center; gap: 8px;">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M19 12H5M12 19l-7-7 7-7"/>
    </svg>
    Back to Companies
  </a>
</div>

<!-- Section Header -->
<div class="section-header">
  <h1 class="section-title">Add New Company</h1>
  <p class="section-subtitle">Add a new company to your CRM pipeline</p>
</div>

<!-- Form Card -->
<div class="card">
  <form method="post" style="display: grid; gap: 32px;">
    {% csrf_token %}

    <!-- Basic Information -->
    <div>
      <h2 style="font: 700 20px var(--d); color: var(--ink); margin-bottom: 20px;">Basic Information</h2>
      <div class="grid-2">
        <div class="form-group">
          <label class="form-label">Company Name *</label>
          <input type="text" name="name" class="form-input" placeholder="Enter company name" required>
        </div>
        <div class="form-group">
          <label class="form-label">Industry</label>
          <select name="industry" class="form-input">
            <option value="">Select industry</option>
            {% for value, label in form.industry.field.choices %}
            <option value="{{ value }}">{{ label }}</option>
            {% endfor %}
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">Business Type</label>
          <input type="text" name="business_type" class="form-input" placeholder="e.g., LLC, PLC, Sole Proprietorship">
        </div>
        <div class="form-group">
          <label class="form-label">Source</label>
          <input type="text" name="source" class="form-input" placeholder="Where did you find this company?">
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">Description</label>
        <textarea name="description" class="form-input" rows="4" placeholder="What does the company do? Current tech stack, etc."></textarea>
      </div>
    </div>

    <!-- Location -->
    <div style="padding-top: 32px; border-top: 1px solid var(--line);">
      <h2 style="font: 700 20px var(--d); color: var(--ink); margin-bottom: 20px;">Location</h2>
      <div class="grid-2">
        <div class="form-group">
          <label class="form-label">Address</label>
          <textarea name="address" class="form-input" rows="2" placeholder="Full physical address"></textarea>
        </div>
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px;">
          <div class="form-group">
            <label class="form-label">City</label>
            <input type="text" name="city" class="form-input" placeholder="City">
          </div>
          <div class="form-group">
            <label class="form-label">Region</label>
            <select name="region" class="form-input">
              <option value="">Select region</option>
              {% for value, label in ethiopian_regions %}
              <option value="{{ value }}">{{ label }}</option>
              {% endfor %}
            </select>
          </div>
        </div>
      </div>
    </div>

    <!-- Status & Tracking -->
    <div style="padding-top: 32px; border-top: 1px solid var(--line);">
      <h2 style="font: 700 20px var(--d); color: var(--ink); margin-bottom: 20px;">Status & Tracking</h2>
      <div class="grid-2">
        <div class="form-group">
          <label class="form-label">Status</label>
          <select name="status" class="form-input">
            <option value="prospect">Prospect</option>
            <option value="contacted">Contacted</option>
            <option value="in_discussion">In Discussion</option>
            <option value="client">Client</option>
            <option value="closed">Closed</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">Tech Readiness (1-5)</label>
          <select name="tech_readiness" class="form-input">
            <option value="">Not assessed</option>
            <option value="1">1 - Very Low (No tech presence)</option>
            <option value="2">2 - Low (Basic website only)</option>
            <option value="3">3 - Medium (Some digital presence)</option>
            <option value="4">4 - High (Good tech stack)</option>
            <option value="5">5 - Very High (Advanced tech infrastructure)</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">Last Contacted</label>
          <input type="date" name="last_contacted" class="form-input">
        </div>
      </div>
    </div>

    <!-- Needs Assessment -->
    <div style="padding-top: 32px; border-top: 1px solid var(--line);">
      <h2 style="font: 700 20px var(--d); color: var(--ink); margin-bottom: 20px;">Needs Assessment</h2>
      <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; margin-bottom: 24px;">
        <label style="display: flex; align-items: center; gap: 12px; font: 500 16px var(--t); color: var(--ink); cursor: pointer;">
          <input type="checkbox" name="needs_website" style="width: 20px; height: 20px; accent-color: var(--core);">
          Needs Website
        </label>
        <label style="display: flex; align-items: center; gap: 12px; font: 500 16px var(--t); color: var(--ink); cursor: pointer;">
          <input type="checkbox" name="needs_erp" style="width: 20px; height: 20px; accent-color: var(--core);">
          Needs ERP System
        </label>
        <label style="display: flex; align-items: center; gap: 12px; font: 500 16px var(--t); color: var(--ink); cursor: pointer;">
          <input type="checkbox" name="needs_upgrade" style="width: 20px; height: 20px; accent-color: var(--core);">
          Needs System Upgrade
        </label>
        <label style="display: flex; align-items: center; gap: 12px; font: 500 16px var(--t); color: var(--ink); cursor: pointer;">
          <input type="checkbox" name="needs_custom_system" style="width: 20px; height: 20px; accent-color: var(--core);">
          Needs Custom System
        </label>
      </div>
      <div class="form-group">
        <label class="form-label">Other Needs</label>
        <textarea name="other_needs" class="form-input" rows="3" placeholder="Any other specific needs..."></textarea>
      </div>
    </div>

    <!-- Notes -->
    <div style="padding-top: 32px; border-top: 1px solid var(--line);">
      <h2 style="font: 700 20px var(--d); color: var(--ink); margin-bottom: 20px;">Notes</h2>
      <div class="form-group">
        <label class="form-label">General Notes</label>
        <textarea name="notes" class="form-input" rows="4" placeholder="Any additional notes about this company..."></textarea>
      </div>
    </div>

    <!-- Submit Buttons -->
    <div style="display: flex; gap: 16px; padding-top: 32px; border-top: 1px solid var(--line);">
      <button type="submit" class="btn btn-primary">Add Company</button>
      <a href="{% url 'crm:company_list' %}" class="btn btn-secondary">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
