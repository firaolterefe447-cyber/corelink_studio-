{% extends "base.html" %}

{% block extra_css %}
<!-- Tailwind CSS -->
<script src="https://cdn.tailwindcss.com"></script>
{% endblock %}

{% block title %}CRM - Corelink Studio{% endblock %}

{% block content %}
<div class="min-h-screen bg-gray-50">
    <!-- CRM Header -->
    <div class="bg-white border-b border-gray-200">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between items-center py-6">
                <div>
                    <h1 class="text-3xl font-bold text-gray-900">CRM Dashboard</h1>
                    <p class="mt-1 text-sm text-gray-500">Ethiopian Business Tracking System</p>
                </div>
                <nav class="flex space-x-4">
                    <a href="{% url 'crm:dashboard' %}" class="px-4 py-2 rounded-md text-sm font-medium {% if request.resolver_match.url_name == 'dashboard' %}bg-blue-100 text-blue-700{% else %}text-gray-700 hover:bg-gray-100{% endif %}">
                        Dashboard
                    </a>
                    <a href="{% url 'crm:company_list' %}" class="px-4 py-2 rounded-md text-sm font-medium {% if request.resolver_match.url_name == 'company_list' %}bg-blue-100 text-blue-700{% else %}text-gray-700 hover:bg-gray-100{% endif %}">
                        Companies
                    </a>
                    <a href="{% url 'crm:pipeline' %}" class="px-4 py-2 rounded-md text-sm font-medium {% if request.resolver_match.url_name == 'pipeline' %}bg-blue-100 text-blue-700{% else %}text-gray-700 hover:bg-gray-100{% endif %}">
                        Pipeline
                    </a>
                    <a href="{% url 'crm:communications' %}" class="px-4 py-2 rounded-md text-sm font-medium {% if request.resolver_match.url_name == 'communications' %}bg-blue-100 text-blue-700{% else %}text-gray-700 hover:bg-gray-100{% endif %}">
                        Communications
                    </a>
                    <a href="/admin/crm/" class="px-4 py-2 rounded-md text-sm font-medium text-gray-700 hover:bg-gray-100">
                        Admin
                    </a>
                </nav>
            </div>
        </div>
    </div>

    <!-- Main Content -->
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        {% block crm_content %}{% endblock %}
    </div>
</div>
{% endblock %}
