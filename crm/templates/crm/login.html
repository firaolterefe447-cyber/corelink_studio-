<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Corelink CRM</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;500;600;700;800&family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --core: #1F4DFF;
            --electric: #1F4DFF;
            --cyan: #8FA8FF;
            --abyss: #0B1F8F;
            --night: #07080D;
            --bg: #F3F3EF;
            --line: #E4E4DE;
            --ink: #0B0D14;
            --muted: #5F6470;
            --accent: #8FA8FF;
            --ease: cubic-bezier(.22,1,.36,1);
            --d: 'Bricolage Grotesque', system-ui, sans-serif;
            --t: 'Hanken Grotesk', system-ui, sans-serif;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font: 400 16px/1.65 var(--t); color: var(--ink); background: #FBFBF9; -webkit-font-smoothing: antialiased; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        h1, h2, h3 { font-family: var(--d); letter-spacing: -0.04em; }
        a { color: inherit; text-decoration: none; }

        .login-container {
            width: 100%;
            max-width: 440px;
            padding: 24px;
        }

        .login-card {
            background: #fff;
            border: 1px solid var(--line);
            border-radius: 24px;
            padding: 48px 40px;
            box-shadow: 0 20px 60px rgba(7,8,13,.08);
        }

        .logo {
            font: 800 32px var(--d);
            letter-spacing: -0.05em;
            color: var(--ink);
            text-align: center;
            margin-bottom: 12px;
        }

        .logo b { color: var(--core); }

        .subtitle {
            font: 500 16px var(--t);
            color: var(--muted);
            text-align: center;
            margin-bottom: 40px;
        }

        .form-group {
            margin-bottom: 24px;
        }

        .form-label {
            display: block;
            font: 700 13px var(--t);
            color: var(--ink);
            margin-bottom: 8px;
            letter-spacing: .05em;
            text-transform: uppercase;
        }

        .form-input {
            width: 100%;
            font: 500 16px var(--t);
            color: var(--ink);
            background: #fff;
            border: 1px solid var(--line);
            border-radius: 12px;
            padding: 14px 16px;
            transition: all .3s var(--ease);
        }

        .form-input:focus {
            outline: none;
            border-color: var(--core);
            box-shadow: 0 0 0 3px rgba(31,77,255,.1);
        }

        .btn {
            width: 100%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font: 700 16px var(--t);
            padding: 14px 28px;
            border-radius: 12px;
            transition: all .3s var(--ease);
            cursor: pointer;
            border: 0;
            margin-top: 8px;
        }

        .btn-primary {
            background: var(--core);
            color: #fff;
            box-shadow: 0 8px 20px -4px rgba(31,77,255,.45), inset 0 1px 0 rgba(255,255,255,.18);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            background: #1539E0;
            box-shadow: 0 14px 28px -6px rgba(31,77,255,.55), inset 0 1px 0 rgba(255,255,255,.18);
        }

        .error-message {
            background: #FEF2F2;
            border: 1px solid #FECACA;
            color: #DC2626;
            padding: 12px 16px;
            border-radius: 12px;
            font: 500 14px var(--t);
            margin-bottom: 24px;
        }

        .info-text {
            font: 500 14px var(--t);
            color: var(--muted);
            text-align: center;
            margin-top: 24px;
            padding-top: 24px;
            border-top: 1px solid var(--line);
        }

        @media(max-width:480px) {
            .login-card { padding: 32px 24px; }
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <div class="logo">core<b>link</b> crm</div>
            <p class="subtitle">Sign in to access the CRM system</p>

            {% if error %}
            <div class="error-message">{{ error }}</div>
            {% endif %}

            <form method="post">
                {% csrf_token %}
                
                <div class="form-group">
                    <label class="form-label" for="username">Username</label>
                    <input 
                        type="text" 
                        name="username" 
                        id="username" 
                        class="form-input" 
                        placeholder="Enter your username"
                        required
                        autofocus
                    >
                </div>

                <div class="form-group">
                    <label class="form-label" for="password">Password</label>
                    <input 
                        type="password" 
                        name="password" 
                        id="password" 
                        class="form-input" 
                        placeholder="Enter your password"
                        required
                    >
                </div>

                <button type="submit" class="btn btn-primary">Sign In</button>
            </form>

            <p class="info-text">
                Contact your CRM administrator if you need access.
            </p>
        </div>
    </div>
</body>
</html>
