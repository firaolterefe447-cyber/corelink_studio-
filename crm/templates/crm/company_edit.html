{% extends "crm/base.html" %}

{% block crm_content %}
<!-- Back Button -->
<div style="margin-bottom: 24px;">
  <a href="{% url 'crm:company_detail' company.id %}" style="font: 600 14px var(--t); color: var(--core); display: inline-flex; align-items: center; gap: 8px;">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M19 12H5M12 19l-7-7 7-7"/>
    </svg>
    Back to {{ company.name }}
  </a>
</div>

<!-- Section Header -->
<div class="section-header">
  <h1 class="section-title">Edit Company</h1>
  <p class="section-subtitle">Update company information</p>
</div>

<!-- Form Card -->
<div class="card">
  <form method="post" style="display: grid; gap: 32px;">
    {% csrf_token %}

    <!-- Basic Information -->
    <div>
      <h2 style="font: 700 20px var(--d); color: var(--ink); margin-bottom: 20px;">Basic Information</h2>
      <div class="grid-2">
        <div class="form-group">
          <label class="form-label">Company Name *</label>
          <input type="text" name="name" class="form-input" value="{{ company.name }}" required>
        </div>
        <div class="form-group">
          <label class="form-label">Industry</label>
          <select name="industry" class="form-input">
            <option value="">Select Industry</option>
            <optgroup label="Technology">
              <option value="technology" {% if company.industry == 'technology' %}selected{% endif %}>Technology & Software</option>
              <option value="software_dev" {% if company.industry == 'software_dev' %}selected{% endif %}>Software Development</option>
              <option value="it_services" {% if company.industry == 'it_services' %}selected{% endif %}>IT Services & Support</option>
              <option value="hardware" {% if company.industry == 'hardware' %}selected{% endif %}>Hardware & Electronics</option>
              <option value="fintech" {% if company.industry == 'fintech' %}selected{% endif %}>Fintech & Digital Payments</option>
              <option value="telecommunications" {% if company.industry == 'telecommunications' %}selected{% endif %}>Telecommunications</option>
              <option value="digital_marketing" {% if company.industry == 'digital_marketing' %}selected{% endif %}>Digital Marketing & SEO</option>
            </optgroup>
            <optgroup label="Banking & Finance">
              <option value="banking_finance" {% if company.industry == 'banking_finance' %}selected{% endif %}>Banking & Finance</option>
              <option value="banking" {% if company.industry == 'banking' %}selected{% endif %}>Banking</option>
              <option value="microfinance" {% if company.industry == 'microfinance' %}selected{% endif %}>Microfinance</option>
              <option value="insurance" {% if company.industry == 'insurance' %}selected{% endif %}>Insurance</option>
              <option value="investment" {% if company.industry == 'investment' %}selected{% endif %}>Investment & Asset Management</option>
              <option value="accounting" {% if company.industry == 'accounting' %}selected{% endif %}>Accounting & Bookkeeping</option>
            </optgroup>
            <optgroup label="Agriculture & Agribusiness">
              <option value="agriculture" {% if company.industry == 'agriculture' %}selected{% endif %}>Agriculture & Agribusiness</option>
              <option value="coffee_tea" {% if company.industry == 'coffee_tea' %}selected{% endif %}>Coffee & Tea Production</option>
              <option value="flower_farming" {% if company.industry == 'flower_farming' %}selected{% endif %}>Flower Farming</option>
              <option value="livestock" {% if company.industry == 'livestock' %}selected{% endif %}>Livestock & Poultry</option>
              <option value="crop_farming" {% if company.industry == 'crop_farming' %}selected{% endif %}>Crop Farming</option>
              <option value="agro_processing" {% if company.industry == 'agro_processing' %}selected{% endif %}>Agro-Processing</option>
            </optgroup>
            <optgroup label="Manufacturing">
              <option value="manufacturing" {% if company.industry == 'manufacturing' %}selected{% endif %}>Manufacturing</option>
              <option value="textile_garment" {% if company.industry == 'textile_garment' %}selected{% endif %}>Textile & Garment</option>
              <option value="textile" {% if company.industry == 'textile' %}selected{% endif %}>Textile & Apparel</option>
              <option value="leather" {% if company.industry == 'leather' %}selected{% endif %}>Leather & Footwear</option>
              <option value="food_processing" {% if company.industry == 'food_processing' %}selected{% endif %}>Food Processing</option>
              <option value="food_beverage" {% if company.industry == 'food_beverage' %}selected{% endif %}>Food & Beverage</option>
              <option value="beverage" {% if company.industry == 'beverage' %}selected{% endif %}>Beverage Production</option>
              <option value="metal_fabrication" {% if company.industry == 'metal_fabrication' %}selected{% endif %}>Metal Fabrication</option>
              <option value="plastic" {% if company.industry == 'plastic' %}selected{% endif %}>Plastic Manufacturing</option>
              <option value="construction_materials" {% if company.industry == 'construction_materials' %}selected{% endif %}>Construction Materials</option>
              <option value="pharma_manufacturing" {% if company.industry == 'pharma_manufacturing' %}selected{% endif %}>Pharmaceutical Manufacturing</option>
            </optgroup>
            <optgroup label="Retail & E-commerce">
              <option value="retail" {% if company.industry == 'retail' %}selected{% endif %}>Retail & E-commerce</option>
              <option value="supermarket" {% if company.industry == 'supermarket' %}selected{% endif %}>Supermarket & Grocery</option>
              <option value="fashion_retail" {% if company.industry == 'fashion_retail' %}selected{% endif %}>Fashion Retail</option>
              <option value="electronics_retail" {% if company.industry == 'electronics_retail' %}selected{% endif %}>Electronics Retail</option>
              <option value="ecommerce" {% if company.industry == 'ecommerce' %}selected{% endif %}>E-commerce</option>
              <option value="wholesale" {% if company.industry == 'wholesale' %}selected{% endif %}>Wholesale & Distribution</option>
            </optgroup>
            <optgroup label="Healthcare">
              <option value="healthcare" {% if company.industry == 'healthcare' %}selected{% endif %}>Healthcare & Pharmaceuticals</option>
              <option value="hospital" {% if company.industry == 'hospital' %}selected{% endif %}>Hospital & Medical Center</option>
              <option value="pharmacy" {% if company.industry == 'pharmacy' %}selected{% endif %}>Pharmacy</option>
              <option value="clinic" {% if company.industry == 'clinic' %}selected{% endif %}>Clinic</option>
              <option value="medical_equipment" {% if company.industry == 'medical_equipment' %}selected{% endif %}>Medical Equipment</option>
              <option value="laboratory" {% if company.industry == 'laboratory' %}selected{% endif %}>Laboratory & Diagnostics</option>
            </optgroup>
            <optgroup label="Education">
              <option value="education" {% if company.industry == 'education' %}selected{% endif %}>Education & Training</option>
              <option value="university" {% if company.industry == 'university' %}selected{% endif %}>University & College</option>
              <option value="private_school" {% if company.industry == 'private_school' %}selected{% endif %}>Private School</option>
              <option value="vocational" {% if company.industry == 'vocational' %}selected{% endif %}>Vocational Training</option>
              <option value="edtech" {% if company.industry == 'edtech' %}selected{% endif %}>EdTech & E-learning</option>
            </optgroup>
            <optgroup label="Construction & Real Estate">
              <option value="construction" {% if company.industry == 'construction' %}selected{% endif %}>Construction & Real Estate</option>
              <option value="real_estate" {% if company.industry == 'real_estate' %}selected{% endif %}>Real Estate</option>
              <option value="architecture" {% if company.industry == 'architecture' %}selected{% endif %}>Architecture & Design</option>
              <option value="interior_design" {% if company.industry == 'interior_design' %}selected{% endif %}>Interior Design</option>
            </optgroup>
            <optgroup label="Transportation & Logistics">
              <option value="transportation" {% if company.industry == 'transportation' %}selected{% endif %}>Transportation & Logistics</option>
              <option value="logistics" {% if company.industry == 'logistics' %}selected{% endif %}>Logistics & Freight</option>
              <option value="courier" {% if company.industry == 'courier' %}selected{% endif %}>Courier & Delivery</option>
              <option value="import_export" {% if company.industry == 'import_export' %}selected{% endif %}>Import/Export</option>
              <option value="customs_brokerage" {% if company.industry == 'customs_brokerage' %}selected{% endif %}>Customs Brokerage</option>
            </optgroup>
            <optgroup label="Hospitality & Tourism">
              <option value="hospitality" {% if company.industry == 'hospitality' %}selected{% endif %}>Hospitality & Tourism</option>
              <option value="hotel" {% if company.industry == 'hotel' %}selected{% endif %}>Hotel & Lodge</option>
              <option value="restaurant" {% if company.industry == 'restaurant' %}selected{% endif %}>Restaurant & Cafe</option>
              <option value="tour_operator" {% if company.industry == 'tour_operator' %}selected{% endif %}>Tour Operator</option>
              <option value="event_management" {% if company.industry == 'event_management' %}selected{% endif %}>Event Management</option>
            </optgroup>
            <optgroup label="Energy & Utilities">
              <option value="energy" {% if company.industry == 'energy' %}selected{% endif %}>Energy & Utilities</option>
              <option value="renewable_energy" {% if company.industry == 'renewable_energy' %}selected{% endif %}>Renewable Energy</option>
              <option value="electricity" {% if company.industry == 'electricity' %}selected{% endif %}>Electricity & Power</option>
              <option value="water" {% if company.industry == 'water' %}selected{% endif %}>Water & Sanitation</option>
            </optgroup>
            <optgroup label="Mining & Natural Resources">
              <option value="mining" {% if company.industry == 'mining' %}selected{% endif %}>Mining & Natural Resources</option>
              <option value="oil_gas" {% if company.industry == 'oil_gas' %}selected{% endif %}>Oil & Gas</option>
              <option value="quarry" {% if company.industry == 'quarry' %}selected{% endif %}>Quarry & Construction Materials</option>
            </optgroup>
            <optgroup label="Media & Entertainment">
              <option value="media_entertainment" {% if company.industry == 'media_entertainment' %}selected{% endif %}>Media & Entertainment</option>
              <option value="media" {% if company.industry == 'media' %}selected{% endif %}>Media & Broadcasting</option>
              <option value="advertising" {% if company.industry == 'advertising' %}selected{% endif %}>Advertising Agency</option>
              <option value="printing" {% if company.industry == 'printing' %}selected{% endif %}>Printing & Publishing</option>
              <option value="photography" {% if company.industry == 'photography' %}selected{% endif %}>Photography & Studio</option>
            </optgroup>
            <optgroup label="Professional Services">
              <option value="legal" {% if company.industry == 'legal' %}selected{% endif %}>Legal Services</option>
              <option value="consulting" {% if company.industry == 'consulting' %}selected{% endif %}>Consulting & Professional Services</option>
              <option value="hr_recruitment" {% if company.industry == 'hr_recruitment' %}selected{% endif %}>HR & Recruitment</option>
              <option value="security" {% if company.industry == 'security' %}selected{% endif %}>Security Services</option>
              <option value="cleaning" {% if company.industry == 'cleaning' %}selected{% endif %}>Cleaning Services</option>
            </optgroup>
            <optgroup label="Government & NGO">
              <option value="government" {% if company.industry == 'government' %}selected{% endif %}>Government & Public Sector</option>
              <option value="ngo" {% if company.industry == 'ngo' %}selected{% endif %}>NGO & Non-Profit</option>
              <option value="international_org" {% if company.industry == 'international_org' %}selected{% endif %}>International Organization</option>
            </optgroup>
            <option value="other" {% if company.industry == 'other' %}selected{% endif %}>Other</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">Business Type</label>
          <input type="text" name="business_type" class="form-input" value="{{ company.business_type|default:"" }}" placeholder="e.g., LLC, PLC, Sole Proprietorship">
        </div>
        <div class="form-group" style="grid-column: span 2;">
          <label class="form-label">Description</label>
          <textarea name="description" class="form-input" rows="4" placeholder="What the company does, current tech stack, etc.">{{ company.description|default:"" }}</textarea>
        </div>
      </div>
    </div>

    <!-- Location -->
    <div style="padding-top: 32px; border-top: 1px solid var(--line);">
      <h2 style="font: 700 20px var(--d); color: var(--ink); margin-bottom: 20px;">Location</h2>
      <div class="grid-2">
        <div class="form-group" style="grid-column: span 2;">
          <label class="form-label">Address</label>
          <textarea name="address" class="form-input" rows="2" placeholder="Full physical address">{{ company.address|default:"" }}</textarea>
        </div>
        <div class="form-group">
          <label class="form-label">City</label>
          <input type="text" name="city" class="form-input" value="{{ company.city|default:"" }}" placeholder="City">
        </div>
        <div class="form-group">
          <label class="form-label">Region</label>
          <select name="region" class="form-input">
            <option value="">Select Region</option>
            {% for value, label in ethiopian_regions %}
            <option value="{{ value }}" {% if company.region == value %}selected{% endif %}>{{ label }}</option>
            {% endfor %}
          </select>
        </div>
      </div>
    </div>

    <!-- Status & Tracking -->
    <div style="padding-top: 32px; border-top: 1px solid var(--line);">
      <h2 style="font: 700 20px var(--d); color: var(--ink); margin-bottom: 20px;">Status & Tracking</h2>
      <div class="grid-2">
        <div class="form-group">
          <label class="form-label">Status</label>
          <select name="status" class="form-input">
            <option value="prospect" {% if company.status == 'prospect' %}selected{% endif %}>Prospect</option>
            <option value="contacted" {% if company.status == 'contacted' %}selected{% endif %}>Contacted</option>
            <option value="in_discussion" {% if company.status == 'in_discussion' %}selected{% endif %}>In Discussion</option>
            <option value="client" {% if company.status == 'client' %}selected{% endif %}>Client</option>
            <option value="closed" {% if company.status == 'closed' %}selected{% endif %}>Closed</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">Tech Readiness</label>
          <select name="tech_readiness" class="form-input">
            <option value="">Select Level</option>
            <option value="1" {% if company.tech_readiness == 1 %}selected{% endif %}>1 - Very Low (No tech presence)</option>
            <option value="2" {% if company.tech_readiness == 2 %}selected{% endif %}>2 - Low (Basic website only)</option>
            <option value="3" {% if company.tech_readiness == 3 %}selected{% endif %}>3 - Medium (Some digital presence)</option>
            <option value="4" {% if company.tech_readiness == 4 %}selected{% endif %}>4 - High (Good tech stack)</option>
            <option value="5" {% if company.tech_readiness == 5 %}selected{% endif %}>5 - Very High (Advanced tech infrastructure)</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">Company Level</label>
          <select name="company_level" class="form-input">
            <option value="">Not classified</option>
            <option value="0" {% if company.company_level == 0 %}selected{% endif %}>Level 0</option>
            <option value="1" {% if company.company_level == 1 %}selected{% endif %}>Level 1</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">Last Contacted</label>
          <input type="date" name="last_contacted" class="form-input" value="{{ company.last_contacted|default:"" }}">
        </div>
        <div class="form-group">
          <label class="form-label">Source</label>
          <input type="text" name="source" class="form-input" value="{{ company.source|default:"" }}" placeholder="Where did you find this company?">
        </div>
      </div>
    </div>

    <!-- Needs Assessment -->
    <div style="padding-top: 32px; border-top: 1px solid var(--line);">
      <h2 style="font: 700 20px var(--d); color: var(--ink); margin-bottom: 20px;">Needs Assessment</h2>
      <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px;">
        <label style="display: flex; align-items: center; gap: 12px; font: 500 16px var(--t); color: var(--ink); cursor: pointer;">
          <input type="checkbox" name="needs_website" style="width: 20px; height: 20px; accent-color: var(--core);" {% if company.needs_website %}checked{% endif %}>
          Needs Website
        </label>
        <label style="display: flex; align-items: center; gap: 12px; font: 500 16px var(--t); color: var(--ink); cursor: pointer;">
          <input type="checkbox" name="needs_erp" style="width: 20px; height: 20px; accent-color: var(--core);" {% if company.needs_erp %}checked{% endif %}>
          Needs ERP System
        </label>
        <label style="display: flex; align-items: center; gap: 12px; font: 500 16px var(--t); color: var(--ink); cursor: pointer;">
          <input type="checkbox" name="needs_upgrade" style="width: 20px; height: 20px; accent-color: var(--core);" {% if company.needs_upgrade %}checked{% endif %}>
          Needs System Upgrade
        </label>
        <label style="display: flex; align-items: center; gap: 12px; font: 500 16px var(--t); color: var(--ink); cursor: pointer;">
          <input type="checkbox" name="needs_custom_system" style="width: 20px; height: 20px; accent-color: var(--core);" {% if company.needs_custom_system %}checked{% endif %}>
          Needs Custom System
        </label>
      </div>
      <div class="form-group" style="margin-top: 16px;">
        <label class="form-label">Other Needs</label>
        <textarea name="other_needs" class="form-input" rows="3" placeholder="Any other specific needs...">{{ company.other_needs|default:"" }}</textarea>
      </div>
    </div>

    <!-- Notes -->
    <div style="padding-top: 32px; border-top: 1px solid var(--line);">
      <h2 style="font: 700 20px var(--d); color: var(--ink); margin-bottom: 20px;">Notes</h2>
      <div class="form-group">
        <label class="form-label">General Notes</label>
        <textarea name="notes" class="form-input" rows="4" placeholder="Any additional notes about this company...">{{ company.notes|default:"" }}</textarea>
      </div>
    </div>

    <!-- Submit Buttons -->
    <div style="display: flex; gap: 16px; padding-top: 32px; border-top: 1px solid var(--line);">
      <button type="submit" class="btn btn-primary">Save Changes</button>
      <a href="{% url 'crm:company_detail' company.id %}" class="btn btn-secondary">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
