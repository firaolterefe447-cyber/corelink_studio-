{% extends "crm/base.html" %}

{% block crm_content %}
<!-- Back Button -->
<div style="margin-bottom: 24px;">
  <a href="{% url 'crm:company_detail' company.id %}" style="font: 600 14px var(--t); color: var(--core); display: inline-flex; align-items: center; gap: 8px;">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M19 12H5M12 19l-7-7 7-7"/>
    </svg>
    Back to {{ company.name }}
  </a>
</div>

<!-- Section Header -->
<div class="section-header">
  <h1 class="section-title">Add Opportunity</h1>
  <p class="section-subtitle">Create a new sales opportunity for {{ company.name }}</p>
</div>

<!-- Form Card -->
<div class="card">
  <form method="post" style="display: grid; gap: 32px;">
    {% csrf_token %}

    <!-- Basic Information -->
    <div>
      <h2 style="font: 700 20px var(--d); color: var(--ink); margin-bottom: 20px;">Basic Information</h2>
      <div class="grid-2">
        <div class="form-group">
          <label class="form-label">Opportunity Title *</label>
          <input type="text" name="title" class="form-input" placeholder="e.g., Website Development Project" required>
        </div>
        <div class="form-group">
          <label class="form-label">Opportunity Type *</label>
          <select name="opportunity_type" class="form-input" required>
            <option value="website">Website Development</option>
            <option value="erp">ERP System</option>
            <option value="upgrade">System Upgrade</option>
            <option value="custom_system">Custom Software</option>
            <option value="mobile_app">Mobile App</option>
            <option value="consulting">Consulting</option>
            <option value="maintenance">Maintenance</option>
            <option value="other">Other</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">Status</label>
          <select name="status" class="form-input">
            <option value="lead">Lead</option>
            <option value="qualified">Qualified</option>
            <option value="proposal">Proposal Sent</option>
            <option value="negotiation">Negotiation</option>
            <option value="won">Won</option>
            <option value="lost">Lost</option>
            <option value="on_hold">On Hold</option>
          </select>
        </div>
      </div>
    </div>

    <!-- Financials -->
    <div style="padding-top: 32px; border-top: 1px solid var(--line);">
      <h2 style="font: 700 20px var(--d); color: var(--ink); margin-bottom: 20px;">Financials</h2>
      <div class="grid-2">
        <div class="form-group">
          <label class="form-label">Estimated Value (ETB)</label>
          <input type="number" name="estimated_value" class="form-input" placeholder="e.g., 50000" step="0.01">
        </div>
        <div class="form-group">
          <label class="form-label">Actual Value (ETB)</label>
          <input type="number" name="actual_value" class="form-input" placeholder="e.g., 45000" step="0.01">
        </div>
      </div>
    </div>

    <!-- Probability & Timeline -->
    <div style="padding-top: 32px; border-top: 1px solid var(--line);">
      <h2 style="font: 700 20px var(--d); color: var(--ink); margin-bottom: 20px;">Probability & Timeline</h2>
      <div class="grid-2">
        <div class="form-group">
          <label class="form-label">Win Probability (%)</label>
          <input type="number" name="probability" class="form-input" placeholder="e.g., 50" min="0" max="100">
        </div>
        <div class="form-group">
          <label class="form-label">Expected Close Date</label>
          <input type="date" name="expected_close_date" class="form-input">
        </div>
        <div class="form-group">
          <label class="form-label">Actual Close Date</label>
          <input type="date" name="actual_close_date" class="form-input">
        </div>
      </div>
    </div>

    <!-- Details -->
    <div style="padding-top: 32px; border-top: 1px solid var(--line);">
      <h2 style="font: 700 20px var(--d); color: var(--ink); margin-bottom: 20px;">Details</h2>
      <div class="form-group">
        <label class="form-label">Description</label>
        <textarea name="description" class="form-input" rows="4" placeholder="Detailed description of the opportunity..."></textarea>
      </div>
      <div class="form-group">
        <label class="form-label">Client Requirements</label>
        <textarea name="requirements" class="form-input" rows="4" placeholder="What are the client's requirements?"></textarea>
      </div>
    </div>

    <!-- Loss Reason (conditional) -->
    <div style="padding-top: 32px; border-top: 1px solid var(--line);">
      <h2 style="font: 700 20px var(--d); color: var(--ink); margin-bottom: 20px;">Additional Information</h2>
      <div class="form-group">
        <label class="form-label">Loss Reason (if lost)</label>
        <textarea name="loss_reason" class="form-input" rows="3" placeholder="Why was this opportunity lost?"></textarea>
      </div>
      <div class="form-group">
        <label class="form-label">Additional Notes</label>
        <textarea name="notes" class="form-input" rows="3" placeholder="Any other notes..."></textarea>
      </div>
    </div>

    <!-- Submit Buttons -->
    <div style="display: flex; gap: 16px; padding-top: 32px; border-top: 1px solid var(--line);">
      <button type="submit" class="btn btn-primary">Add Opportunity</button>
      <a href="{% url 'crm:company_detail' company.id %}" class="btn btn-secondary">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
